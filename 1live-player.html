<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>1LIVE Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
  color: #fff; height: 100dvh; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0)
           env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
.topbar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 2px solid #222;
}
.logo-box {
  display: flex; align-items: center; gap: 8px;
  background: #e8001c; border-radius: 8px; padding: 7px 14px 7px 10px;
  cursor: pointer; transition: filter .15s;
}
.logo-box:active { filter: brightness(1.3); }
.logo-dot  { width:11px; height:11px; border-radius:50%; background:#fff; flex-shrink:0; }
.logo-text { font-size:22px; font-weight:900; color:#fff; letter-spacing:-0.5px; }
.logo-sub  { font-size:13px; font-weight:900; color:#fff; opacity:.75; padding-left:4px; }
.version   { font-size:11px; color:#555; font-weight:700; padding-left:8px; }
.topbar-right { display:flex; align-items:center; gap:10px; }
.live-badge { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:800; letter-spacing:2px; color:#00e676; }
.live-badge.behind { color:#555; }
.live-dot { width:10px; height:10px; border-radius:50%; background:#00e676; animation:blink 1.4s ease-in-out infinite; }
.live-badge.behind .live-dot { background:#555; animation:none; }
@keyframes blink { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.3;transform:scale(1.4);} }
.btn-icon {
  background:none; border:1.5px solid #333; border-radius:8px; color:#666;
  font-size:16px; cursor:pointer; width:34px; height:34px;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent; transition:color .15s, border-color .15s;
  flex-shrink:0;
}
.btn-icon:active { color:#fff; border-color:#555; }
.now-playing {
  flex-shrink:0; padding:8px 14px; border-bottom:2px solid #222;
  min-height:38px; display:flex; align-items:center; gap:8px;
}
.np-label { font-size:11px; font-weight:700; color:#e8001c; letter-spacing:1px; text-transform:uppercase; flex-shrink:0; }
.np-text  { font-size:13px; font-weight:600; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.np-text.dim { color:#555; font-style:italic; }
.progress-strip { flex-shrink:0; padding:8px 14px 10px; border-bottom:2px solid #222; }
.prog-labels { display:flex; justify-content:space-between; font-size:14px; font-weight:700; color:#fff; margin-bottom:6px; }
.prog-track { width:100%; height:8px; background:#333; border-radius:4px; cursor:pointer; }
.prog-fill  { height:100%; background:#e8001c; border-radius:4px; transition:width .5s linear; width:100%; }
.main { flex:1; min-height:0; display:flex; flex-direction:row; padding:10px; gap:10px; }
.col     { flex:1; display:flex; flex-direction:column; gap:10px; }
.col-mid { flex:0 0 32%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
.btn {
  flex:1; border:none; cursor:pointer; border-radius:16px; font-family:inherit; font-weight:800;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; min-height:0; width:100%;
  -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation;
  transition:transform .1s, filter .1s;
}
.btn:active { transform:scale(0.90); filter:brightness(1.4); }
.btn-back { background:#1e0306; color:#ff8fa0; border:2px solid #5a1018; }
.btn-fwd  { background:#060e25; color:#8fc0ff; border:2px solid #142050; }
.btn .ico { font-size:clamp(24px,6.5vw,36px); line-height:1; }
.btn .lbl { font-size:clamp(13px,3.8vw,18px); }
.btn-play {
  border:none; cursor:pointer; border-radius:50%; background:#e8001c; color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 0 36px rgba(232,0,28,0.45);
  -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation;
  transition:transform .1s, filter .1s;
}
.btn-play:active { transform:scale(0.88); filter:brightness(1.2); }
.btn-live {
  display:none; border:none; cursor:pointer; border-radius:14px;
  background:#00e676; color:#000; font-family:inherit;
  font-size:clamp(16px,4.5vw,22px); font-weight:900; letter-spacing:.5px;
  width:100%; padding:14px 0; align-items:center; justify-content:center; gap:8px;
  flex-shrink:0; -webkit-tap-highlight-color:transparent; user-select:none;
  touch-action:manipulation; transition:transform .1s;
}
.btn-live:active { transform:scale(0.92); }
.btn-spotify {
  display:none; border:none; cursor:pointer; border-radius:14px;
  background:#1db954; color:#000; font-family:inherit;
  font-size:clamp(14px,4vw,18px); font-weight:900; letter-spacing:.5px;
  width:100%; padding:12px 0; align-items:center; justify-content:center; gap:8px;
  flex-shrink:0; -webkit-tap-highlight-color:transparent; user-select:none;
  touch-action:manipulation; transition:transform .1s;
}
.btn-spotify:active { transform:scale(0.92); filter:brightness(0.85); }
.bottom { flex-shrink:0; border-top:2px solid #222; padding:8px 14px 10px; }
.status { font-size:13px; color:#888; text-align:center; min-height:18px; font-weight:600; }
.status.err { color:#ff6b6b; }
audio { display:none; }

/* Station-Switcher Overlay */
.station-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96);
  z-index:998; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px;
}
.station-overlay.open { display:flex; }
.station-title { font-size:14px; font-weight:900; color:#888; letter-spacing:3px; text-transform:uppercase; margin-bottom:8px; }
.station-btn {
  width:100%; max-width:320px; border:none; border-radius:16px; cursor:pointer;
  padding:20px; font-family:inherit; font-weight:900; font-size:20px;
  display:flex; align-items:center; gap:14px;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:transform .1s, filter .1s;
}
.station-btn:active { transform:scale(0.95); }
.station-btn-1live  { background:#e8001c; color:#fff; }
.station-btn-diggi  { background:#6600cc; color:#fff; }
.station-btn .s-dot { width:14px; height:14px; border-radius:50%; background:#fff; flex-shrink:0; }
.station-btn .s-name { flex:1; text-align:left; }
.station-btn .s-check { font-size:20px; }
.station-cancel {
  margin-top:8px; background:none; border:1.5px solid #333; border-radius:12px;
  color:#666; font-family:inherit; font-size:15px; font-weight:700;
  padding:12px 32px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}

/* Debug Overlay */
.debug-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95);
  z-index:999; flex-direction:column; padding:16px;
}
.debug-overlay.open { display:flex; }
.debug-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:10px; flex-shrink:0;
}
.debug-title { font-size:14px; font-weight:900; color:#ff0; letter-spacing:2px; }
.debug-close {
  background:none; border:1.5px solid #555; border-radius:8px; color:#aaa;
  font-size:18px; cursor:pointer; width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
}
.debug-log {
  flex:1; overflow-y:auto; background:#111; border-radius:8px;
  padding:10px; font-size:11px; font-family:monospace; color:#aaa;
  white-space:pre-wrap; word-break:break-all; margin-bottom:10px;
}
.debug-log .line-err  { color:#ff6b6b; }
.debug-log .line-ok   { color:#00e676; }
.debug-log .line-info { color:#8fc0ff; }
.debug-copy {
  flex-shrink:0; border:none; border-radius:12px; background:#ff0;
  color:#000; font-family:inherit; font-size:15px; font-weight:900;
  padding:14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.debug-copy:active { filter:brightness(0.8); }
.debug-copied { background:#00e676 !important; }
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center">
    <div class="logo-box" id="btnStation">
      <div class="logo-dot"></div>
      <div class="logo-text" id="logoText">1LIVE</div>
      <div class="logo-sub" id="logoSub"></div>
    </div>
    <div class="version">v9.4</div>
  </div>
  <div class="topbar-right">
    <div class="live-badge" id="liveBadge"><div class="live-dot"></div>LIVE</div>
    <button class="btn-icon" id="btnDebug" title="Debug-Log">🐛</button>
    <button class="btn-icon" id="btnReload" title="Seite neu laden">↺</button>
  </div>
</div>

<div class="now-playing">
  <span class="np-label">♫</span>
  <span class="np-text dim" id="npText">—</span>
</div>

<div class="progress-strip">
  <div class="prog-labels">
    <span id="lblBehind"></span>
    <span id="lblClock">– LIVE –</span>
  </div>
  <div class="prog-track" id="progTrack"><div class="prog-fill" id="progFill"></div></div>
</div>

<div class="main">
  <div class="col">
    <button class="btn btn-back" data-sec="-3600"><span class="ico">⏮</span><span class="lbl">− 1 Std</span></button>
    <button class="btn btn-back" data-sec="-1800"><span class="ico">⏮</span><span class="lbl">− 30 Min</span></button>
    <button class="btn btn-back" data-sec="-60"><span class="ico">⏮</span><span class="lbl">− 1 Min</span></button>
    <button class="btn btn-back" data-sec="-10"><span class="ico">⏮</span><span class="lbl">− 10 Sek</span></button>
  </div>
  <div class="col-mid" id="colMid">
    <button class="btn-play" id="btnPlay">▶</button>
    <button class="btn-live" id="btnLive">● LIVE</button>
    <button class="btn-spotify" id="btnSpotify">♫ Spotify</button>
  </div>
  <div class="col">
    <button class="btn btn-fwd" data-sec="3600"><span class="ico">⏭</span><span class="lbl">+ 1 Std</span></button>
    <button class="btn btn-fwd" data-sec="1800"><span class="ico">⏭</span><span class="lbl">+ 30 Min</span></button>
    <button class="btn btn-fwd" data-sec="60"><span class="ico">⏭</span><span class="lbl">+ 1 Min</span></button>
    <button class="btn btn-fwd" data-sec="10"><span class="ico">⏭</span><span class="lbl">+ 10 Sek</span></button>
  </div>
</div>

<div class="bottom">
  <div class="status" id="statusMsg">Tippe ▶ zum Starten</div>
</div>

<!-- Station Switcher -->
<div class="station-overlay" id="stationOverlay">
  <div class="station-title">Sender wählen</div>
  <button class="station-btn station-btn-1live" id="switchTo1live">
    <div class="s-dot"></div>
    <div class="s-name">1LIVE</div>
    <div class="s-check" id="check1live">✓</div>
  </button>
  <button class="station-btn station-btn-diggi" id="switchToDiggi">
    <div class="s-dot"></div>
    <div class="s-name">1LIVE DIGGI</div>
    <div class="s-check" id="checkDiggi"></div>
  </button>
  <button class="station-cancel" id="stationCancel">Abbrechen</button>
</div>

<!-- Debug Overlay -->
<div class="debug-overlay" id="debugOverlay">
  <div class="debug-header">
    <span class="debug-title" id="debugTitle">🐛 DEBUG LOG v9.4</span>
    <button class="debug-close" id="debugClose">✕</button>
  </div>
  <div class="debug-log" id="debugLog"></div>
  <button class="debug-copy" id="debugCopy">📋 Log kopieren</button>
</div>

<audio id="audio"></audio>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwoAI846IaHDiSGb7N6IZ_N08ZPlWUaGw90Aj0PTLcUpHWiTSleZ7UfTXzVx-4vJeQ6hg/exec';

const STATIONS = {
  '1live': {
    label:    '1LIVE',
    sub:      '',
    color:    '#e8001c',
    hls:      'https://wdrhf.akamaized.net/hls/live/2027955/1live/master.m3u8',
    mp3:      'https://wdr-1live-live.icecastssl.wdr.de/wdr/1live/live/mp3/128/stream.mp3',
  },
  'diggi': {
    label:    '1LIVE',
    sub:      'DIGGI',
    color:    '#6600cc',
    hls:      'https://wdrhf.akamaized.net/hls/live/2027963/1livediggi/master.m3u8',
    mp3:      'https://wdr-1live-diggi.icecastssl.wdr.de/wdr/1live/diggi/mp3/128/stream.mp3',
  }
};

// DOM refs
const audio          = document.getElementById('audio');
const btnPlay        = document.getElementById('btnPlay');
const btnLive        = document.getElementById('btnLive');
const btnSpotify     = document.getElementById('btnSpotify');
const btnReload      = document.getElementById('btnReload');
const btnDebug       = document.getElementById('btnDebug');
const btnStation     = document.getElementById('btnStation');
const statusMsg      = document.getElementById('statusMsg');
const liveBadge      = document.getElementById('liveBadge');
const progFill       = document.getElementById('progFill');
const lblBehind      = document.getElementById('lblBehind');
const lblClock       = document.getElementById('lblClock');
const progTrack      = document.getElementById('progTrack');
const npText         = document.getElementById('npText');
const logoText       = document.getElementById('logoText');
const logoSub        = document.getElementById('logoSub');
const stationOverlay = document.getElementById('stationOverlay');
const stationCancel  = document.getElementById('stationCancel');
const switchTo1live  = document.getElementById('switchTo1live');
const switchToDiggi  = document.getElementById('switchToDiggi');
const check1live     = document.getElementById('check1live');
const checkDiggi     = document.getElementById('checkDiggi');
const debugOverlay   = document.getElementById('debugOverlay');
const debugLog       = document.getElementById('debugLog');
const debugClose     = document.getElementById('debugClose');
const debugCopy      = document.getElementById('debugCopy');
const debugTitle     = document.getElementById('debugTitle');

// State
let currentStation = '1live';
let hls = null, isPlaying = false, dvrAvailable = false, usingFallback = false;
let anchorCT = null, anchorWall = null;
let playlist = [], playlistLoaded = false, playlistLoading = false;
let streamtitleInterval = null, streamtitleLast = '';
const eventLog = [];

// ── Logging ───────────────────────────────────────────────────
function logEvent(msg, level) {
  const ts = new Date().toISOString().replace('T',' ').substring(0,19);
  eventLog.push({ line: ts + ' | ' + msg, level: level || 'info' });
  if (eventLog.length > 300) eventLog.shift();
}

// ── Station UI ────────────────────────────────────────────────
function applyStation(key) {
  const s = STATIONS[key];
  logoText.textContent = s.label;
  logoSub.textContent  = s.sub;
  document.querySelector('.logo-box').style.background = s.color;
  document.querySelector('.prog-fill').style.background = s.color;
  document.querySelector('.np-label').style.color = s.color;
  document.querySelector('.version').style.color = s.color;
  check1live.textContent = key === '1live' ? '✓' : '';
  checkDiggi.textContent = key === 'diggi'  ? '✓' : '';
  document.title = key === 'diggi' ? '1LIVE DIGGI Player' : '1LIVE Player';
  debugTitle.textContent = '🐛 DEBUG LOG v9.4 [' + key + ']';
}

btnStation.addEventListener('click', () => stationOverlay.classList.add('open'));
stationCancel.addEventListener('click', () => stationOverlay.classList.remove('open'));

function switchStation(key) {
  if (key === currentStation) { stationOverlay.classList.remove('open'); return; }
  stationOverlay.classList.remove('open');
  logEvent('station-switch: ' + currentStation + ' → ' + key);

  // Stop current playback
  audio.pause();
  if (hls) { hls.destroy(); hls = null; }
  isPlaying = false; btnPlay.textContent = '▶';
  dvrAvailable = false; usingFallback = false;
  anchorCT = null; anchorWall = null;
  playlist = []; playlistLoaded = false; playlistLoading = false;
  streamtitleLast = '';
  if (streamtitleInterval) { clearInterval(streamtitleInterval); streamtitleInterval = null; }
  showNp('—', true);
  btnSpotify.style.display = 'none';
  btnLive.style.display = 'none';
  progFill.style.width = '100%';
  lblBehind.textContent = '';
  lblClock.textContent = '– LIVE –';
  liveBadge.classList.remove('behind');

  currentStation = key;
  applyStation(key);
  statusMsg.textContent = 'Tippe ▶ zum Starten';
  statusMsg.className = 'status';
  initHLS();
}

switchTo1live.addEventListener('click', () => switchStation('1live'));
switchToDiggi.addEventListener('click', () => switchStation('diggi'));

// ── Player Logic ──────────────────────────────────────────────
function getLiveEdge() {
  if (audio.seekable && audio.seekable.length > 0)
    return audio.seekable.end(audio.seekable.length - 1);
  const d = audio.duration;
  return (!isNaN(d) && d !== Infinity && d > 0) ? d : null;
}

function setAnchor() {
  const edge = getLiveEdge();
  if (edge === null) return;
  anchorCT = edge; anchorWall = Date.now();
  logEvent('anchor set: ct=' + edge.toFixed(1), 'ok');
}

function getStreamTime() {
  if (!dvrAvailable || anchorCT === null) return new Date();
  return new Date(anchorWall + (audio.currentTime - anchorCT) * 1000);
}

function pad2(n) { return String(n).padStart(2,'0'); }
function fmtClock(d) { return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
function fmtBehind(s) {
  s = Math.round(s);
  if (s >= 3600) return '-'+Math.floor(s/3600)+'h '+pad2(Math.floor((s%3600)/60))+'m hinter live';
  if (s >= 60)   return '-'+Math.floor(s/60)+'m '+pad2(s%60)+'s hinter live';
  return '-'+s+'s hinter live';
}
function fmtDelta(s) {
  s = Math.abs(Math.round(s));
  if (s >= 3600) return Math.floor(s/3600)+'h '+pad2(Math.floor((s%3600)/60))+'m';
  if (s >= 60)   return Math.floor(s/60)+'m '+pad2(s%60)+'s';
  return s+'s';
}

function updateUI() {
  const streamT   = getStreamTime();
  const behindMs  = Date.now() - streamT.getTime();
  const behindSec = Math.max(0, behindMs / 1000);

  lblClock.textContent = (dvrAvailable && anchorCT !== null) ? fmtClock(streamT) : '– LIVE –';

  if (dvrAvailable && behindSec > 3) {
    progFill.style.width  = Math.max(0, Math.min(100, (1 - behindSec/7500)*100)) + '%';
    lblBehind.textContent = fmtBehind(behindSec);
    btnLive.style.display = 'flex';
    liveBadge.classList.add('behind');
  } else {
    progFill.style.width  = '100%';
    lblBehind.textContent = '';
    btnLive.style.display = 'none';
    liveBadge.classList.remove('behind');
  }

  if (!isPlaying) return;

  if (behindSec <= 10) {
    if (streamtitleLast) {
      showNp(streamtitleLast, false);
      btnSpotify.style.display = 'flex';
    }
    return;
  }
  if (!playlistLoaded) { showNp('Playlist wird geladen…', true); btnSpotify.style.display='none'; return; }
  if (!playlist.length) { showNp('Keine Titeldaten', true); btnSpotify.style.display='none'; return; }

  const epochMin = Math.floor(streamT.getTime() / 60000);
  let found = null;
  for (let i = playlist.length - 1; i >= 0; i--) {
    if (playlist[i].epochMin <= epochMin) { found = playlist[i]; break; }
  }
  const npStr = found ? (found.artist ? found.artist+' — '+found.title : found.title) : '—';
  showNp(npStr, !found);
  btnSpotify.style.display = (found && isPlaying) ? 'flex' : 'none';
}

function showNp(text, dim) {
  npText.textContent = text;
  npText.className = 'np-text' + (dim ? ' dim' : '');
}

function startStreamtitlePolling() {
  if (streamtitleInterval) clearInterval(streamtitleInterval);
  fetchStreamtitle();
  streamtitleInterval = setInterval(fetchStreamtitle, 30000);
}

function fetchStreamtitle() {
  const url = WEBAPP_URL + '?action=streamtitle&station=' + currentStation;
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (data.ok && data.title && data.title !== streamtitleLast) {
        streamtitleLast = data.title;
        logEvent('now-playing: ' + data.title, 'ok');
      }
    }).catch(err => logEvent('streamtitle-error: ' + err.message, 'err'));
}

function loadPlaylist() {
  playlistLoading = true;
  showNp('Playlist wird geladen…', true);
  logEvent('playlist-fetch: start [' + currentStation + ']');
  const xhr = new XMLHttpRequest();
  xhr.open('GET', WEBAPP_URL + '?action=playlist&station=' + currentStation, true);
  xhr.onload = function() {
    try {
      const data = JSON.parse(xhr.responseText);
      if (data.ok && Array.isArray(data.items)) {
        playlist = data.items; playlistLoaded = true;
        logEvent('playlist-fetch: ok, ' + data.items.length + ' Eintraege, range=' +
          (data.items.length ? data.items[0].time + '–' + data.items[data.items.length-1].time : 'leer'), 'ok');
        showNp('—', true);
      } else {
        playlistLoaded = true;
        logEvent('playlist-fetch: error ' + (data.error||'unknown'), 'err');
        showNp('—', true);
      }
    } catch(e) {
      playlistLoaded = true;
      logEvent('playlist-fetch: parse error, status=' + xhr.status, 'err');
      showNp('—', true);
    }
  };
  xhr.onerror = function() {
    playlistLoaded = true;
    logEvent('playlist-fetch: network error', 'err');
    showNp('—', true);
  };
  xhr.send();
}

progTrack.addEventListener('click', e => {
  if (!dvrAvailable || anchorCT === null) return;
  const edge = getLiveEdge(); if (!edge) return;
  const r = progTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  audio.currentTime = Math.max(0, Math.min(edge, edge - 7500 * (1 - pct)));
});

function seek(delta) {
  if (!dvrAvailable) { statusMsg.textContent = 'Kein DVR-Puffer.'; return; }
  const edge = getLiveEdge(); if (!edge) return;
  const before = audio.currentTime;
  audio.currentTime = Math.max(0, Math.min(edge, audio.currentTime + delta));
  logEvent('seek: '+(delta>0?'+':'')+delta+'s, ct='+before.toFixed(0)+'→'+audio.currentTime.toFixed(0));
  statusMsg.textContent = delta < 0 ? '− '+fmtDelta(delta)+' zurück' : '+ '+fmtDelta(delta)+' vor';
}
document.querySelectorAll('[data-sec]').forEach(b => b.addEventListener('click', () => seek(+b.dataset.sec)));

function sizePlay() {
  const mid = document.getElementById('colMid');
  const liveH    = btnLive.offsetHeight    || 0;
  const spotifyH = btnSpotify.offsetHeight || 0;
  const gap = 10;
  const usedH = (liveH > 0 ? liveH + gap : 0) + (spotifyH > 0 ? spotifyH + gap : 0);
  const size = Math.min(mid.clientHeight - usedH, mid.clientWidth, 200);
  btnPlay.style.width = btnPlay.style.height = size + 'px';
  btnPlay.style.fontSize = Math.round(size * 0.4) + 'px';
}
window.addEventListener('resize', sizePlay);
requestAnimationFrame(() => requestAnimationFrame(sizePlay));

btnPlay.addEventListener('click', () => {
  if (!playlistLoaded && !playlistLoading) {
    loadPlaylist();
    startStreamtitlePolling();
  }
  if (isPlaying) audio.pause();
  else audio.play().catch(err => {
    statusMsg.textContent = 'Nochmal tippen ▶';
    logEvent('play-error: ' + err.message, 'err');
  });
});

btnLive.addEventListener('click', () => {
  if (!dvrAvailable) return;
  const edge = getLiveEdge();
  if (edge) audio.currentTime = edge - 1;
  setAnchor();
  statusMsg.textContent = 'Zurück zur Live-Kante.';
  logEvent('jump-to-live', 'ok');
});

btnSpotify.addEventListener('click', () => {
  const text = npText.textContent;
  if (!text || text === '—') return;
  window.open('https://open.spotify.com/search/' + encodeURIComponent(text), '_blank');
  logEvent('spotify-search: ' + text);
});

btnReload.addEventListener('click', () => { logEvent('manual-reload'); setTimeout(() => location.reload(), 100); });

// ── HLS ───────────────────────────────────────────────────────
function initHLS() {
  const st = STATIONS[currentStation];
  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    hls = new Hls({ enableWorker:true, lowLatencyMode:false, backBufferLength:90, maxBufferLength:60, maxMaxBufferLength:7200 });
    hls.loadSource(st.hls);
    hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      statusMsg.textContent = 'Stream bereit — tippe ▶';
      logEvent('hls: manifest parsed [' + currentStation + ']', 'ok');
    });
    hls.on(Hls.Events.LEVEL_LOADED, (_, d) => {
      if (d.details && d.details.totalduration > 30 && !dvrAvailable) {
        dvrAvailable = true;
        logEvent('hls: DVR verfügbar, ' + Math.round(d.details.totalduration/60) + ' Min', 'ok');
      }
    });
    hls.on(Hls.Events.ERROR, (_, d) => {
      logEvent('hls-error: '+d.type+'/'+d.details+(d.fatal?' [FATAL]':''), 'err');
      if (d.fatal) { statusMsg.textContent = 'HLS-Fehler → MP3…'; hls.destroy(); hls=null; initMP3(); }
    });
  } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
    audio.src = st.hls;
    logEvent('native-hls: using Safari HLS [' + currentStation + ']');
    audio.addEventListener('durationchange', () => {
      const d = audio.duration;
      if (d && d !== Infinity && d > 30 && !dvrAvailable) {
        dvrAvailable = true;
        logEvent('native-hls: DVR verfügbar', 'ok');
      }
    });
  } else { initMP3(); }
}

function initMP3() {
  const st = STATIONS[currentStation];
  usingFallback = true; audio.src = st.mp3; dvrAvailable = false;
  statusMsg.textContent = 'Tippe ▶ (MP3, kein Timeshift)';
  document.querySelectorAll('[data-sec]').forEach(b => { b.disabled=true; b.style.opacity='0.3'; });
  logEvent('fallback: MP3 [' + currentStation + ']', 'err');
}

audio.addEventListener('playing', () => {
  isPlaying = true; btnPlay.textContent = '⏸';
  statusMsg.textContent = usingFallback ? 'Spielt (MP3).' : 'Spielt.';
  if (dvrAvailable && anchorCT === null) setAnchor();
  sizePlay();
  logEvent('audio: playing, ct=' + audio.currentTime.toFixed(1), 'ok');
});
audio.addEventListener('pause',   () => { isPlaying=false; btnPlay.textContent='▶'; logEvent('audio: pause'); });
audio.addEventListener('waiting', () => { statusMsg.textContent='Puffert…'; logEvent('audio: waiting'); });
audio.addEventListener('stalled', () => { logEvent('audio: stalled', 'err'); });
audio.addEventListener('error',   () => {
  const c = audio.error ? audio.error.code : '?';
  const m = audio.error ? audio.error.message : '';
  statusMsg.textContent = 'Fehler. Neu laden.'; statusMsg.className = 'status err';
  logEvent('audio: error code='+c+' msg='+m, 'err');
});
audio.addEventListener('timeupdate', updateUI);
setInterval(updateUI, 1000);

// ── Debug Overlay ─────────────────────────────────────────────
function buildSnap() {
  return [
    '=== SNAPSHOT @ ' + new Date().toISOString().substring(0,19) + ' ===',
    'station:      ' + currentStation,
    'isPlaying:    ' + isPlaying,
    'dvrAvailable: ' + dvrAvailable,
    'usingFallback:' + usingFallback,
    'anchorCT:     ' + anchorCT,
    'anchorWall:   ' + (anchorWall ? new Date(anchorWall).toISOString() : 'null'),
    'currentTime:  ' + audio.currentTime.toFixed(1),
    'duration:     ' + audio.duration,
    'seekable.end: ' + (audio.seekable.length ? audio.seekable.end(audio.seekable.length-1).toFixed(1) : 'n/a'),
    'playlistItems:' + playlist.length,
    'playlistLoaded:' + playlistLoaded,
    'streamTitle:  ' + streamtitleLast,
    '=== EVENT LOG (' + eventLog.length + ' entries) ===',
    ''
  ].join('\n');
}

btnDebug.addEventListener('click', () => {
  debugLog.innerHTML = '';
  const snapEl = document.createElement('div');
  snapEl.style.color = '#ff0'; snapEl.style.marginBottom = '8px';
  snapEl.textContent = buildSnap();
  debugLog.appendChild(snapEl);
  eventLog.forEach(({ line, level }) => {
    const el = document.createElement('div');
    el.className = level === 'err' ? 'line-err' : level === 'ok' ? 'line-ok' : 'line-info';
    el.textContent = line;
    debugLog.appendChild(el);
  });
  debugOverlay.classList.add('open');
  debugLog.scrollTop = debugLog.scrollHeight;
});

debugClose.addEventListener('click', () => debugOverlay.classList.remove('open'));

debugCopy.addEventListener('click', () => {
  const text = buildSnap() + eventLog.map(e => e.line).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    debugCopy.textContent = '✅ Kopiert!';
    debugCopy.classList.add('debug-copied');
    setTimeout(() => { debugCopy.textContent = '📋 Log kopieren'; debugCopy.classList.remove('debug-copied'); }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    debugCopy.textContent = '✅ Kopiert!';
    setTimeout(() => { debugCopy.textContent = '📋 Log kopieren'; }, 2000);
  });
});

// ── Init ──────────────────────────────────────────────────────
logEvent('player init v9.4 [' + currentStation + ']');
applyStation(currentStation);
initHLS();
</script>
</body>
</html>
